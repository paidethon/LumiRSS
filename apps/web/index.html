<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover：延伸到刘海/圆角全面屏，配合 CSS
         env(safe-area-inset-*) 留出安全区（0007） -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LumiRSS — 流光阅源</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 0009 Gate 1 / 0020 AUDIT-008：主题防首帧闪烁（FOUC）。单一真源
         是规范 key lumirss-settings 的 themeMode；仅当缺失/无效时回退旧 key
         lumirss-theme（迁移安全）。逻辑与 src/lib/theme.ts 的
         resolveInitialTheme 保持一致：显式 light/dark 直接采用，system 跟随 OS。 -->
    <script>
      ;(function () {
        try {
          var mode = null
          var rawSettings = localStorage.getItem('lumirss-settings')
          if (rawSettings) {
            try {
              var parsed = JSON.parse(rawSettings)
              if (
                parsed &&
                (parsed.themeMode === 'light' ||
                  parsed.themeMode === 'dark' ||
                  parsed.themeMode === 'system')
              ) {
                mode = parsed.themeMode
              }
            } catch (e) {
              mode = null
            }
          }
          if (mode === null) {
            var legacy = localStorage.getItem('lumirss-theme')
            if (legacy === 'light' || legacy === 'dark' || legacy === 'system') {
              mode = legacy
            }
          }
          var theme =
            mode === 'light' || mode === 'dark'
              ? mode
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

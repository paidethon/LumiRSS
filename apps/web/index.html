<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover：延伸到刘海/圆角全面屏，配合 CSS
         env(safe-area-inset-*) 留出安全区（0007） -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LumiRSS — 流光阅源</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 0009 Gate 1：主题防首帧闪烁（FOUC）。在 React 加载前读同一
         个 localStorage key（lumirss-theme）并挂 data-theme；逻辑与
         src/lib/theme.ts 保持一致。 -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('lumirss-theme')
          var theme =
            raw === 'light' || raw === 'dark'
              ? raw
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

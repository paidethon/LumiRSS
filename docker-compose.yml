services:
  # Digest pin (drift policy parity with rsshub here and caddy in
  # apps/web/Dockerfile): ab6b363… = the 1.29.1 multi-arch index.
  freshrss:
    image: freshrss/freshrss:1.29.1@sha256:ab6b363102ccdbc39f6a62db926f567c61a5289bf25ba460f1c34423d8cc1a4d
    container_name: freshrss
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # 仅本机可访问
    environment:
      TZ: Asia/Shanghai
      # FreshRSS 容器内置 cron 的自动刷新分钟（本部署唯一调度拥有者）。
      # 缺省时 cron 不启动，RSS 永不自动更新（M0 根因）。
      CRON_MIN: "13,43"
    volumes:
      - freshrss-data:/var/www/FreshRSS/data

  rsshub:
    image: diygod/rsshub@sha256:387fd32ee2d8789154dcf6446a52365976e768d9ede1a7c1e610cf4da9d89fbc
    container_name: rsshub
    restart: unless-stopped
    ports:
      - "127.0.0.1:1200:1200" # 仅本机可访问
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:1200/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  freshrss-data:

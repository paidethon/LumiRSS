; LumiRSS all-in-one php-fpm pool overrides — loaded after Debian's www.conf
; (alphabetical pool.d order), so these values win for the [www] pool.
; Socket (unix:/run/php/php8.4-fpm.sock), user/group www-data and
; listen.owner/group come from www.conf unchanged.
[www]
; Small-VPS budget (1.6 GB host): FreshRSS workers are ~30-60 MB each.
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

; Same upload/POST ceilings the official FreshRSS image sets in php.ini.
php_admin_value[post_max_size] = 32M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[memory_limit] = 128M

; Worker errors -> stderr -> docker logs (master error_log is set to
; /proc/self/fd/2 in the Dockerfile).
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
catch_workers_output = yes

name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required documentation
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "AGENTS.md"
            "docs/README.md"
            "docs/product/PRD.md"
            "docs/architecture/README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required documentation file is missing or empty"
              exit 1
            fi
          done

      - name: Reject tracked secret and runtime files
        shell: bash
        run: |
          set -euo pipefail
          # .env.example is allowed: it may be reintroduced when real
          # configuration design happens.
          tracked_sensitive="$(
            git ls-files |
              grep -E '(^|/)\.env($|\.)|\.(sqlite|sqlite-[^/]+|db)$|(^|/)(data|logs|backups)/' |
              grep -v -E '(^|/)\.env\.example$' || true
          )"

          if [[ -n "$tracked_sensitive" ]]; then
            echo "::error::Secret or runtime files are tracked"
            printf '%s\n' "$tracked_sensitive"
            exit 1
          fi

      - name: Basic repository sanity
        shell: bash
        run: |
          set -euo pipefail
          # Fail on unresolved Git conflict markers.
          if git grep -nE '^(<{7}|>{7})( |$)'; then
            echo "::error::Unresolved merge conflict markers found"
            exit 1
          fi
          # Local development habit: run `git diff --check` before commit.

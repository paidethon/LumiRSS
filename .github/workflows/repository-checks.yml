name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required documentation
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "AGENTS.md"
            "docs/README.md"
            "docs/product/PRD.md"
            "docs/explanation/architecture.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Required documentation file is missing or empty"
              exit 1
            fi
          done

      - name: Verify version single source (O190)
        shell: bash
        run: python3 scripts/check-version.py

      # FIX-373/FIX-372: image metadata (OCI labels, build args, ci-gate
      # identity) is wired to VERSION + the tested SHA; drift fails here.
      - name: Verify release pipeline metadata (FIX-373)
        shell: bash
        run: python3 scripts/check-image-metadata.py

      - name: Reject tracked secret and runtime files
        shell: bash
        run: |
          set -euo pipefail
          # .env.example / .env.prod.example are allowed: checked-in
          # templates with empty placeholder values (0018).
          tracked_sensitive="$(
            git ls-files |
              grep -E '(^|/)\.env($|\.)|\.(sqlite|sqlite-[^/]+|db)$|(^|/)(data|logs|backups)/' |
              grep -v -E '(^|/)\.env(\.prod)?\.example$' || true
          )"

          if [[ -n "$tracked_sensitive" ]]; then
            echo "::error::Secret or runtime files are tracked"
            printf '%s\n' "$tracked_sensitive"
            exit 1
          fi

      - name: Validate env example templates
        run: python3 scripts/check_env_example.py

      - name: Basic repository sanity
        shell: bash
        run: |
          set -euo pipefail
          # Fail on unresolved Git conflict markers.
          if git grep -nE '^(<{7}|>{7})( |$)'; then
            echo "::error::Unresolved merge conflict markers found"
            exit 1
          fi
          # Local development habit: run `git diff --check` before commit.

  deploy-lifecycle:
    name: Deploy lifecycle (compose render, external Caddy mode)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deploy lifecycle tests
        run: tests/deploy/run-deploy-tests.sh

      # FIX-373/FIX-375: metadata mutations are caught, build contexts stay
      # subdirectory-scoped, and a poisoned context is really excluded
      # (FROM-scratch probe with the repo's own .dockerignore).
      - name: Run release pipeline metadata + build-context tests
        run: tests/deploy/run-image-metadata-tests.sh

      # FIX-374/377/378/379: exec bits survive packaging, release SHA256SUMS
      # covers the actual upload set, promotion identity is verified, and a
      # half-finished release cannot end green.
      - name: Run release publishing tests
        run: tests/deploy/run-release-publish-tests.sh

      # FIX-390: a command piped into tail/head must never return success
      # after the real command failed.
      - name: Check pipe error propagation (FIX-390)
        run: python3 scripts/check-pipefail.py

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bff-tests:
    name: BFF tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Verify uv.lock is in sync with pyproject (reproducible prod image)
        working-directory: services/bff
        run: uv lock --check

      - name: Ruff static checks (duplicate definitions, real-bug patterns)
        working-directory: services/bff
        run: uv run ruff check src tests scripts

      - name: Run BFF tests
        working-directory: services/bff
        run: uv run pytest -q

  generated-contracts:
    name: Generated contracts drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Regenerate API schema + settings metadata and fail on drift
        working-directory: apps/web
        run: |
          pnpm api:generate
          pnpm settings:generate
          git diff --exit-code -- src/api/generated

  web-tests:
    name: Web tests / lint / build (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: apps/web
        run: pnpm test

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Build
        working-directory: apps/web
        run: pnpm build

  e2e-smoke:
    name: Playwright Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production bundle
        working-directory: apps/web
        run: pnpm build

      - name: Run deterministic smoke (static build + honest API-degraded states)
        working-directory: apps/web
        env:
          LUMIRSS_E2E_BASE_URL: http://127.0.0.1:4173
          LUMIRSS_CI_STATIC: "1"
        run: pnpm exec playwright test --project=desktop-1440 e2e/ci-smoke.spec.ts

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  compose-config:
    name: Production compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose config
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml config > /dev/null \
            && echo "compose config OK"

  docker-build:
    name: Production image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 0020 AUDIT-019: the production Dockerfiles must actually build. Bounded
      # image-build verification only — images are tagged locally and NEVER
      # pushed. BuildKit is default on ubuntu-latest runners.
      - name: Build BFF production image (uv --frozen lock install)
        run: >-
          docker build --build-arg LUMIRSS_COMMIT=${{ github.sha }}
          -t lumirss-bff:ci services/bff

      - name: Build Web production image
        run: >-
          docker build --build-arg VITE_GIT_COMMIT=${{ github.sha }}
          -t lumirss-web:ci apps/web

      - name: Confirm images were built
        run: |
          docker image inspect lumirss-bff:ci > /dev/null && echo "bff image OK"
          docker image inspect lumirss-web:ci > /dev/null && echo "web image OK"

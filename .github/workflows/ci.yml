name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bff-tests:
    name: BFF tests (Python 3.12, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # 套件时长史：r5 轮 2000+ 用例 ~16.5min（15→25）；R2 后 3300+ 用例 +
    # --extra rag，单 runner 实测 45:16 处仍 67%（45→75），高负载期两次
    # 在 1h16m 整触顶取消（2026-10-01）。改为按测试文件确定性二分片并行
    # （无新插件、无进程内并行——sqlite 会话级夹具不兼容 xdist）；每片
    # 只拿一半文件，round-robin 保持负载均衡。空片=失败（FIX-383：空集
    # 不能作为通过证据）。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Verify uv.lock is in sync with pyproject (reproducible prod image)
        working-directory: services/bff
        run: uv lock --check

      - name: Ruff static checks (duplicate definitions, real-bug patterns)
        working-directory: services/bff
        run: uv run ruff check src tests scripts

      - name: Run BFF tests (shard ${{ matrix.shard }}/2)
        working-directory: services/bff
        # --extra rag mirrors the production image (Dockerfile uv sync),
        # so the RAG tests exercise the shipped dependency set.
        run: |
          mapfile -t files < <(ls tests/test_*.py | LC_ALL=C sort)
          shard_file="$(mktemp)"
          i=0
          for f in "${files[@]}"; do
            if (( i % 2 == ${{ matrix.shard }} - 1 )); then printf '%s\n' "$f" >> "$shard_file"; fi
            i=$((i+1))
          done
          count=$(wc -l < "$shard_file")
          total=${#files[@]}
          echo "shard ${{ matrix.shard }}: $count/$total test files"
          if [[ ! -s "$shard_file" ]]; then
            echo "FAIL: empty shard (collection must not be zero — FIX-383)" >&2
            exit 1
          fi
          # shellcheck disable=SC2046
          uv run --extra rag pytest -q $(cat "$shard_file")

  generated-contracts:
    name: Generated contracts drift check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Regenerate API schema + settings metadata and fail on drift
        working-directory: apps/web
        run: |
          pnpm api:generate
          pnpm settings:generate
          git diff --exit-code -- src/api/generated

  web-tests:
    name: Web tests / lint / build (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: apps/web
        run: pnpm test

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Build
        working-directory: apps/web
        run: pnpm build

  e2e-smoke:
    name: Playwright Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [web-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: |
          # The runner's google-chrome apt source can serve a stale index
          # (Hash Sum mismatch) which fails --with-deps' apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          pnpm exec playwright install --with-deps chromium

      - name: Build production bundle
        working-directory: apps/web
        run: pnpm build

      - name: Run deterministic smoke (static build + honest API-degraded states)
        working-directory: apps/web
        env:
          LUMIRSS_E2E_BASE_URL: http://127.0.0.1:4173
          LUMIRSS_CI_STATIC: "1"
        run: pnpm exec playwright test --project=desktop-1440 e2e/ci-smoke.spec.ts

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  e2e-journeys:
    # E05：核心用户旅程真实闭环——boot 完整 e2e compose 栈
    # （FreshRSS/RSSHub/BFF/Caddy），跑登录/订阅/时间线/已读收藏/
    # 设置持久化等 journey（desktop-journeys.spec.ts 的核心集）。
    # FIX-182/ARCH-03：J4 AI journey 的 purpose-profiles 契约漂移已在
    # 测试侧收敛（精确锚定「默认 Base URL」/「默认 Model」/exact「保存」，
    # 见 desktop-journeys.spec.ts），恢复为门内必需旅程——不再 grep-invert。
    name: Playwright core journeys (e2e stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [web-tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          pnpm exec playwright install --with-deps chromium

      - name: Boot e2e stack (build + up)
        run: docker compose -f e2e/stack/docker-compose.e2e.yml up -d --build

      - name: Init (FreshRSS install / pool / owner password / allow-list)
        run: e2e/stack/run-smoke.sh up

      - name: Wait (bounded) for the stack to serve
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/ || true)
            if [ "$code" = "200" ]; then echo "stack ready after ~$((i*10))s"; exit 0; fi
            sleep 10
          done
          echo "stack never became ready"
          docker compose -f e2e/stack/docker-compose.e2e.yml logs --tail 40
          exit 1

      - name: Run core Playwright journeys against live stack
        working-directory: apps/web
        env:
          LUMIRSS_E2E_BASE_URL: http://127.0.0.1:8088
          LUMIRSS_E2E_LOGIN: e2e-login-pwpw
        run: |
          # FIX-182/ARCH-03: J4 back in the gate — full file, no exclusions.
          pnpm exec playwright test --project=desktop-1440 \
            e2e/desktop-journeys.spec.ts

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-journeys-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  compose-config:
    name: Production compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose config
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml config > /dev/null \
            && echo "compose config OK"

      - name: Validate external-Caddy compose override
        run: |
          LUMIRSS_EXTERNAL_CADDY=1 docker compose \
            -f docker-compose.prod.yml -f docker-compose.external-caddy.yml \
            config > /dev/null \
            && echo "external-caddy compose config OK"

      # Dev/CI-only build overlay must stay mergeable with the (now
      # prebuilt-only) production file.
      - name: Validate build overlay merge
        run: |
          LUMIRSS_BUILD_COMMIT=ci docker compose \
            -f docker-compose.prod.yml -f docker-compose.build.yml \
            config > /dev/null \
            && echo "build overlay compose config OK"

  docker-build:
    name: Production image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 0020 AUDIT-019: the production Dockerfiles must actually build. Bounded
      # image-build verification only — images are tagged locally and NEVER
      # pushed. BuildKit is default on ubuntu-latest runners.
      - name: Build BFF production image (uv --frozen lock install)
        run: >-
          docker build --build-arg LUMIRSS_COMMIT=${{ github.sha }}
          --build-arg LUMIRSS_VERSION="$(cat VERSION)"
          -t lumirss-bff:ci services/bff

      - name: Build Web production image
        run: >-
          docker build --build-arg VITE_GIT_COMMIT=${{ github.sha }}
          --build-arg LUMIRSS_VERSION="$(cat VERSION)"
          -t lumirss-web:ci apps/web

      - name: Confirm images were built
        run: |
          docker image inspect lumirss-bff:ci > /dev/null && echo "bff image OK"
          docker image inspect lumirss-web:ci > /dev/null && echo "web image OK"

      - name: Build all-in-one production image (no push)
        run: >-
          docker build --build-arg LUMIRSS_VERSION="$(cat VERSION)"
          --build-arg LUMIRSS_COMMIT=${{ github.sha }}
          --build-arg VITE_GIT_COMMIT=${{ github.sha }}
          -t lumirss-allinone:ci .
      - name: All-in-one serves SPA at /srv root (R3 nesting guard)
        run: |
          docker image inspect lumirss-allinone:ci > /dev/null && echo "allinone image OK"
          docker run --rm --entrypoint sh lumirss-allinone:ci -c "test -f /srv/index.html && echo 'SPA at /srv OK'"

  docs-build:
    name: Docs site build (dead-link gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install docs tooling
        run: npm ci

      - name: Build docs (internal dead links fail the build)
        run: npm run docs:build

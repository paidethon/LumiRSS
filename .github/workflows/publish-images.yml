name: Publish images

# Builds and pushes the BFF + Web images to GHCR.ARCH-04 same-SHA gate:
# a push to main only publishes AFTER the CI workflow has concluded
# "success" on that exact commit (workflow_run carries the tested SHA);
# tag/manual triggers query the commit's latest completed CI run and
# refuse to publish without a green one. A failing commit therefore can
# never become a production image. `latest` tracks main; version tags
# are immutable references for update/rollback (LUMIRSS_IMAGE_TAG in
# .env.prod pins). Each run also emits an unsigned (plain-checksum)
# release-manifest.json + SHA256SUMS: workflow artifact always, attached
# to the tag's GitHub Release when one already exists (this workflow
# never creates releases).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # release-asset upload only (guarded step below); no other contents writes
  packages: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  # Same-SHA quality gate: every publish path must be able to name one
  # commit whose CI run concluded success. workflow_run gives that
  # directly; tag/manual runs look the run up by head_sha.
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI on the exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            conclusion="${{ github.event.workflow_run.conclusion }}"
            echo "CI on $sha concluded: $conclusion"
            [[ "$conclusion" == "success" ]]
            exit 0
          fi
          sha="${{ github.sha }}"
          conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // empty')"
          if [[ -z "$conclusion" ]]; then
            echo "no completed CI run for $sha — refusing to publish" >&2
            exit 1
          fi
          if [[ "$conclusion" != "success" ]]; then
            echo "CI on $sha concluded '$conclusion' — refusing to publish" >&2
            exit 1
          fi
          echo "CI on $sha: success"

  push-images:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run events check out the default branch tip by
          # default; pin to the commit CI actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve tested SHA
        id: tested
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          sha="${{ steps.tested.outputs.sha }}"
          # GHCR rejects any uppercase character in the repository path;
          # GITHUB_REPOSITORY keeps the checkout casing (paidethon/LumiRSS).
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${sha::12}" >> "$GITHUB_OUTPUT"
          fi
          # FIX-373: OCI label version = the VERSION file of the TESTED tree
          # (the checkout above is pinned to the tested SHA), so image tag,
          # OCI labels and the O190 version single source can never diverge.
          echo "version_file=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push BFF image
        id: bff
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.10.0
        with:
          context: ./services/bff
          push: true
          build-args: |
            LUMIRSS_COMMIT=${{ steps.tested.outputs.sha }}
            LUMIRSS_VERSION=${{ steps.tags.outputs.version_file }}
          tags: |
            ghcr.io/${{ steps.tags.outputs.repo }}/lumirss-bff:${{ steps.tags.outputs.version }}
            ${{ github.event_name == 'workflow_run' && format('ghcr.io/{0}/lumirss-bff:latest', steps.tags.outputs.repo) || '' }}

      - name: Build and push Web image
        id: web
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./apps/web
          push: true
          build-args: |
            VITE_GIT_COMMIT=${{ steps.tested.outputs.sha }}
            LUMIRSS_VERSION=${{ steps.tags.outputs.version_file }}
          tags: |
            ghcr.io/${{ steps.tags.outputs.repo }}/lumirss-web:${{ steps.tags.outputs.version }}
            ${{ github.event_name == 'workflow_run' && format('ghcr.io/{0}/lumirss-web:latest', steps.tags.outputs.repo) || '' }}

      # Plain advisory manifest: no signing infrastructure (kept out of
      # scope for this project size), but every value an operator needs to
      # verify what they run. './lumirss export-images' picks this file up
      # automatically when it sits next to the checkout.
      # N195: the manifest also carries the TARGET tree's migration list so
      # GET /admin/upgrade-preview can diff it against the applied
      # schema_migrations and show (or block) the DB impact before an
      # update. min_compat is a maintainer-declared upgrade floor
      # (null = no declared floor); pin a version here when one exists.
      - name: Emit release manifest + SHA256SUMS
        run: |
          set -euo pipefail
          repo="${{ steps.tags.outputs.repo }}"
          version="${{ steps.tags.outputs.version }}"
          bff_digest="${{ steps.bff.outputs.digest }}"
          web_digest="${{ steps.web.outputs.digest }}"
          test -n "$bff_digest" && test -n "$web_digest"
          migrations_json="$(python3 -c 'import glob, json, os; print(json.dumps(sorted(os.path.basename(p) for p in glob.glob("services/bff/src/lumirss/migrations/*.sql"))))')"
          cat > release-manifest.json <<JSON
          {
            "schema": "lumirss-release-manifest/v1",
            "name": "LumiRSS",
            "version": "$version",
            "git_sha": "${{ steps.tested.outputs.sha }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "images": {
              "bff": "ghcr.io/$repo/lumirss-bff@$bff_digest",
              "web": "ghcr.io/$repo/lumirss-web@$web_digest"
            },
            "migrations": $migrations_json,
            "min_compat": null,
            "note": "Unsigned advisory manifest (plain checksums, no signing infra). Verify with SHA256SUMS; pin LUMIRSS_IMAGE_TAG=$version in .env.prod."
          }
          JSON
          # Artifact-scope sums: covers exactly this artifact's own files.
          # The tag-release SHA256SUMS is rebuilt over the FULL asset set in
          # the attach step below (FIX-377).
          sha256sum release-manifest.json > SHA256SUMS
          cat release-manifest.json

      - name: Upload manifest artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: |
            release-manifest.json
            SHA256SUMS
          if-no-files-found: error

      # FIX-378: promotion identity — the manifest attached to the tag's
      # release must describe images built from THE TAG'S commit with the
      # exact digests THIS run pushed. A rebuilt candidate is never silently
      # promoted as the same package: tag commit == tested SHA == manifest
      # git_sha, and both image references are digest-pinned to this run.
      - name: Verify promotion identity (tag commit == build SHA == digests)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse HEAD)"
          python3 scripts/verify-release-promotion.py \
            --manifest release-manifest.json \
            --tag-commit "$tag_commit" \
            --expected-sha "${{ steps.tested.outputs.sha }}" \
            --expected-version "${{ steps.tags.outputs.version }}" \
            --bff-digest "${{ steps.bff.outputs.digest }}" \
            --web-digest "${{ steps.web.outputs.digest }}"

      # Attach the manifest to the GitHub Release matching the tag, but
      # only when a release already exists (e.g. cut by the maintainer):
      # this workflow deliberately never creates releases.
      # FIX-377: a release can carry more than the manifest — notably the
      # offline image archive ('./lumirss export-images' tar) the maintainer
      # attached. The old flow clobbered SHA256SUMS with a manifest-only
      # file, silently stripping the archive's checksum entry. Now: download
      # the release's existing assets into the checksum set, then REBUILD
      # SHA256SUMS over the actual final asset set (scripts/release-sums.sh)
      # and clobber-upload only the two regenerated files.
      - name: Attach manifest to the tag's GitHub Release (when one exists)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no existing release for $tag — manifest stays a workflow artifact"
            exit 0
          fi
          rm -rf release-assets && mkdir release-assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release-assets
          rm -f release-assets/release-manifest.json release-assets/SHA256SUMS
          cp release-manifest.json release-assets/
          scripts/release-sums.sh release-assets
          ( cd release-assets && gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
              --clobber release-manifest.json SHA256SUMS )
          echo "manifest attached to release $tag; SHA256SUMS covers every release asset"

      # FIX-379: a half-finished release must not end green. Before the
      # workflow concludes, assert against SERVER truth that every REQUIRED
      # asset exists with content, and that SHA256SUMS names exactly the
      # asset set (every official attachment has a checksum entry).
      - name: Assert required release assets exist
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no release for $tag — artifact path (guarded by if-no-files-found: error)"
            exit 0
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > release-assets.json
          python3 scripts/check-release-assets.py \
            --assets-json release-assets.json \
            --sums release-assets/SHA256SUMS \
            --required release-manifest.json SHA256SUMS

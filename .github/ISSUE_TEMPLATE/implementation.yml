name: Implementation task
description: Plan a scoped LumiRSS implementation task
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Check `AGENTS.md`, the PRD, relevant ADRs and the API contract before implementation.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State one observable outcome.
      placeholder: What should be true when this Issue is complete?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: List the exact behavior and files or components allowed to change.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: List tempting adjacent work that must not be included.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use checkboxes and make every item independently verifiable.
      placeholder: |
        - [ ] Observable result
        - [ ] Failure behavior
        - [ ] Verification evidence
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and data impact
      description: Note credentials, external calls, user data, SSRF or deployment impact.
      placeholder: None, or describe the impact and mitigation.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Required verification
      description: List tests, lint, type checks, contract checks and manual evidence.
    validations:
      required: true

[project]
name = "lumirss-bff"
version = "0.1.0"
description = "LumiRSS Backend-for-Frontend (BFF)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumirss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
